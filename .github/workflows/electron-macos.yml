name: Squadlink Moderno para Mac
on:
  workflow_dispatch:
  push:
    branches: ['preview/electron-escritorio']
    paths: ['electron/**', 'public/**', '.github/workflows/electron*.yml']
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar escritorio Apple Silicon
        working-directory: electron
        run: |
          test "$(uname -m)" = arm64
          npm ci --no-fund --no-audit
          npm run build
          bash package-mac.sh
      - name: Actualizar la app instalada y verificar el reinicio
        env:
          SQUADLINK_MAC_UPDATE_ZIP: artifacts/macos/Squadlink-Moderno-macOS-arm64.zip
        run: node --test electron/update-mac.test.cjs
      - name: Abrir la app y probar el lobby en macOS
        run: |
          ditto -x -k artifacts/macos/Squadlink-Moderno-macOS-arm64.zip "$RUNNER_TEMP/preview"
          node --test electron/gateway.test.cjs electron/update-release.test.cjs electron/update-controller.test.cjs electron/update-cache.test.cjs
          node test/windows/voice-lobby.mjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 8 --retry-connrefused http://127.0.0.1:4179/api/directory >/dev/null
          SQUADLINK_TEST_APP="$RUNNER_TEMP/preview/Squadlink Moderno.app" node --test electron/finder-launch.test.cjs
          kill "$fixture_pid"
          wait "$fixture_pid" || true
          trap - EXIT
          node electron/smoke.cjs "$RUNNER_TEMP/preview/Squadlink Moderno.app/Contents/MacOS/Electron"
      - uses: actions/upload-artifact@v4
        with:
          name: Squadlink-Moderno-macOS-arm64
          path: artifacts/macos/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Capturas-Squadlink-macOS
          path: artifacts/capturas/
          if-no-files-found: error

