name: Santiago voice pilot
on:
  push:
    branches: [qa/santiago-24h-20261123]
    paths: ['test/santiago-pilot.mjs', '.github/workflows/santiago-24h.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PILOT_RELAY: '146.235.245.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test/santiago-pilot.mjs
