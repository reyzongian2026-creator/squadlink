name: Squadlink moderno para Windows
on:
  workflow_dispatch:
  push:
    branches: ['preview/electron-escritorio']
    paths: ['electron/**','public/**','windows/Desktop/**','.github/workflows/electron*.yml']
permissions:
  contents: read
jobs:
  escritorio:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar el lobby y la sesión
        run: |
          npm test
          node --test electron/gateway.test.cjs electron/update-release.test.cjs electron/update-controller.test.cjs electron/update-cache.test.cjs
      - name: Compilar la interfaz de Electron y React
        working-directory: electron
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          node build.cjs
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          node -e "const fs=require('fs');const path=require('path');fs.cpSync(path.dirname(require('electron')),'../artifacts/portable',{recursive:true})"
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          Rename-Item ../artifacts/portable/electron.exe Squadlink.exe
          Copy-Item stage ../artifacts/portable/resources/app -Recurse
      - name: Instalar y probar llamadas en Windows
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" electron/setup.iss
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $setup=(Resolve-Path artifacts/electron/Squadlink-Moderno-Setup-x64.exe).Path
          $target=Join-Path $env:RUNNER_TEMP 'Squadlink Moderno'
          $result=Start-Process $setup -ArgumentList "/VERYSILENT /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($result.ExitCode) {throw 'Falló la instalación'}
          node electron/smoke.cjs (Join-Path $target 'Squadlink.exe')
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          node test/windows/update-cache-ui.cjs (Join-Path $target 'Squadlink.exe')
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $remove=Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT /NORESTART' -Wait -PassThru
          if ($remove.ExitCode -or (Test-Path (Join-Path $target 'Squadlink.exe'))) {throw 'Falló la desinstalación'}
          (Get-FileHash $setup).Hash+'  Squadlink-Moderno-Setup-x64.exe' | Set-Content artifacts/electron/SHA256.txt
      - name: Instalar el EXE personal autocontenido con cartuchos de diagnóstico
        if: ${{ !cancelled() && hashFiles('artifacts/electron/Squadlink-Moderno-Setup-x64.exe') != '' }}
        run: |
          $package=New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'Paquete personal')
          $cartridges=New-Item -ItemType Directory (Join-Path $package.FullName 'cartridges')
          $setup=(Copy-Item artifacts/electron/Squadlink-Moderno-Setup-x64.exe $package.FullName -PassThru).FullName
          $target=Join-Path $env:RUNNER_TEMP 'Arcade personal'
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {diagnosticCartridge} from './test/duck-nes-fixture.mjs'; writeFileSync(process.argv[1], diagnosticCartridge())" (Join-Path $cartridges.FullName 'duck-nes.nes')
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          Copy-Item (Join-Path $cartridges.FullName 'duck-nes.nes') (Join-Path $cartridges.FullName 'mario3.nes')
          $mario=(Get-Item (Join-Path $cartridges.FullName 'mario3.nes')).FullName
          $duck=(Get-Item (Join-Path $cartridges.FullName 'duck-nes.nes')).FullName
          $expected=(Get-FileHash $duck).Hash
          $maker=Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path $maker)) {
            foreach ($attempt in 1..3) {
              choco install nsis.install -y --no-progress
              if (Test-Path $maker) {break}
              if ($attempt -lt 3) {Start-Sleep -Seconds 5}
            }
            if (!(Test-Path $maker)) {throw 'No se pudo preparar NSIS'}
          }
          $personal=Join-Path $env:RUNNER_TEMP 'Squadlink-Personal.exe'
          & $maker "/DPUBLIC_SETUP=$setup" "/DMARIO_ROM=$mario" "/DDUCK_ROM=$duck" "/DOUTPUT_EXE=$personal" electron/personal-setup.nsi
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          # Install on a clean target after removing every external source file.
          Remove-Item -Recurse $package.FullName
          $result=Start-Process $personal -ArgumentList "/S /D=$target" -Wait -PassThru
          if ($result.ExitCode) {throw 'Falló la instalación con cartuchos integrados'}
          foreach ($name in 'mario3.nes','duck-nes.nes') {
            $installed=Join-Path $target "resources\app\cartridges\$name"
            if ((Get-FileHash $installed).Hash -ne $expected) {throw "El cartucho $name no se instaló correctamente"}
          }
          $profileDir=Join-Path $env:RUNNER_TEMP 'Perfil de prueba de actualización'
          $publicSetup=(Resolve-Path artifacts/electron/Squadlink-Moderno-Setup-x64.exe).Path
          $installedExe=Join-Path $target 'Squadlink.exe'
          node test/windows/apply-update.cjs $publicSetup $installedExe $profileDir
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $limit=[DateTime]::UtcNow.AddSeconds(65)
          do {
            $reopened=Get-CimInstance Win32_Process -Filter "Name='Squadlink.exe'" | Where-Object {
              $_.ExecutablePath -eq $installedExe -and $_.CommandLine -notmatch '(?i)--type=' -and
              $_.CommandLine.IndexOf($profileDir, [StringComparison]::OrdinalIgnoreCase) -ge 0
            } | Select-Object -First 1
            if (!$reopened) {Start-Sleep -Milliseconds 400}
          } until ($reopened -or [DateTime]::UtcNow -gt $limit)
          if (!$reopened) {throw 'La actualización silenciosa no reabrió la app en el perfil original'}
          $wanted=(Get-Content electron/package.json -Raw | ConvertFrom-Json).version
          $version=(Get-Content (Join-Path $target 'resources\app\package.json') -Raw | ConvertFrom-Json).version
          if ($version -ne $wanted) {throw "Se reinició la versión $version, se esperaba $wanted"}
          if ((Get-Content (Join-Path $profileDir 'jugador-prueba.txt') -Raw) -ne 'Pepe') {throw 'Se perdió el perfil'}
          foreach ($name in 'mario3.nes','duck-nes.nes') {
            if ((Get-FileHash (Join-Path $target "resources\app\cartridges\$name")).Hash -ne $expected) {throw "Se perdió $name"}
          }
          Write-Host "Actualización automática correcta: $version en la ruta y perfil originales con ambos cartuchos."
          $process=Get-Process -Id $reopened.ProcessId
          $limit=[DateTime]::UtcNow.AddSeconds(15)
          while ($process.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $limit) {
            Start-Sleep -Milliseconds 200
            $process.Refresh()
          }
          if (!$process.CloseMainWindow()) {throw 'No se pudo cerrar la ventana de prueba'}
          $limit=[DateTime]::UtcNow.AddSeconds(10)
          do {
            Start-Sleep -Milliseconds 200
            $process.Refresh()
          } while (!$process.HasExited -and $process.MainWindowHandle -ne 0 -and [DateTime]::UtcNow -lt $limit)
          if ($process.HasExited -or $process.MainWindowHandle -ne 0) {throw 'Cerrar la ventana debe mantener Squadlink en la bandeja'}
          # The smoke test exercises graceful quit. Tear down this isolated installer fixture.
          Stop-Process -Id $process.Id -ErrorAction Stop
          if (!$process.WaitForExit(10000)) {throw 'No terminó la instancia de prueba'}
          $remove=Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT /NORESTART' -Wait -PassThru
          if ($remove.ExitCode) {throw 'Falló la desinstalación con cartuchos'}
      - uses: actions/upload-artifact@v4
        with:
          name: Squadlink-Electron-Windows-x64
          path: artifacts/electron/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Capturas-Squadlink-Moderno
          path: artifacts/capturas/
