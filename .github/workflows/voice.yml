name: Voice integration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voice.yml'
      - 'test/browser-smoke.mjs'
      - 'public/**'
      - 'server.mjs'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify the shared pilot lobby
        if: github.ref == 'refs/heads/main'
        env:
          SQUADLINK_TEST_ORIGIN: https://squadlink-lobby.onrender.com
        run: npm run test:browser
