name: Voice integration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voice.yml'
      - 'test/browser-smoke.mjs'
      - 'public/**'
      - 'server.mjs'
      - '*.mjs'
      - 'test/**'
      - 'package*.json'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: squadlink_test
          POSTGRES_PASSWORD: local-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
        env:
          SQUADLINK_TEST_DATABASE_URL: postgresql://postgres:local-ci-test@127.0.0.1:5432/squadlink_test
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Wait for Render to serve this client revision
        if: github.ref == 'refs/heads/main'
        run: node test/support/wait-for-pilot.mjs
      - name: Verify the shared pilot lobby
        if: github.ref == 'refs/heads/main'
        env:
          SQUADLINK_TEST_ORIGIN: https://squadlink-lobby.onrender.com
        run: npm run test:browser
